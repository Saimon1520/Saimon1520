# Regenera las tarjetas de assets/ con datos reales (incluye repos privados) cada 6 horas.
# Requiere el secret STATS_TOKEN (token de solo lectura a todos los repos); sin él no hace
# nada, para no reemplazar las tarjetas por datos solo de repos públicos.
name: Update profile cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/generate_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - name: Check token
        if: env.GH_TOKEN == ''
        run: echo "::warning::Falta el secret STATS_TOKEN; las tarjetas no se actualizaron."
      - uses: actions/checkout@v5
        if: env.GH_TOKEN != ''
      - name: Generate cards
        if: env.GH_TOKEN != ''
        run: python3 .github/scripts/generate_cards.py Saimon1520 assets
      - name: Commit and push
        if: env.GH_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Update profile cards"
          git push
